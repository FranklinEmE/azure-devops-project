apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-devops-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: azure-devops-app
  template:
    metadata:
      labels:
        app: azure-devops-app
    spec:
      containers:
      - name: azure-devops-app
        image: devopsacrfrank123.azurecr.io/azure-devops-app:latest
        ports:
        - containerPort: 80